<h1>Admin sign in</h1><form (ngSubmit)="submit()" class="col-md-5"><div class="mb-3"><label for="email" class="form-label">Email</label><input id="email" name="email" type="email" class="form-control" [(ngModel)]="email" required></div><div class="mb-3"><label for="password" class="form-label">Password</label><input id="password" name="password" type="password" class="form-control" [(ngModel)]="password" required></div>@if(error){<div class="alert alert-danger">{{error}}</div>}<button class="btn btn-primary" type="submit" [disabled]="loading">Sign in</button></form>
