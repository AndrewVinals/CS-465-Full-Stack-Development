<div class="d-flex justify-content-between align-items-center mb-4"><h1>Trip listing</h1><a class="btn btn-primary" routerLink="/add-trip">Add trip</a></div>
@if(message){<div class="alert alert-success" role="status">{{message}}</div>}
@if(error){<div class="alert alert-danger" role="alert">{{error}}</div>}
@if(loading){<p>Loading trips…</p>} @else {<div class="row g-4">@for(trip of trips;track trip.code){<div class="col-md-6 col-lg-4"><app-trip-card [trip]="trip" (remove)="remove($event)" /></div>}@empty{<p>No trips yet. Add your first trip.</p>}</div>}
