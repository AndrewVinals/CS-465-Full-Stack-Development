<article class="card h-100 shadow-sm"><img class="card-img-top" [src]="'/images/'+trip.image" [alt]="trip.name"><div class="card-body"><h2 class="h5">{{trip.name}}</h2><p class="text-muted">{{trip.resort}}</p><p>{{trip.length}} · {{trip.start | date:'mediumDate':'UTC'}}</p><p class="fw-bold">{{trip.perPerson | currency}} per person</p><p>{{trip.description}}</p>@if(auth.isLoggedIn()){<div class="d-flex gap-2"><a class="btn btn-primary" [routerLink]="['/edit-trip',trip.code]">Edit trip</a><button class="btn btn-outline-danger" (click)="remove.emit(trip)">Delete</button></div>}</div></article>
